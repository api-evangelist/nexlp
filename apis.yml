description: NexLP was a Chicago-based legal artificial intelligence company known for
  its Story Engine platform, which applied data science, machine learning, and natural
  language processing to legal, investigations, compliance, and eDiscovery workflows.
  NexLP was acquired by Reveal Data in 2020 and folded into Reveal's AI-powered
  eDiscovery and legal intelligence platform. The nexlp.com domain no longer hosts a
  public website and exposes no developer API surface; live DNS probes show its
  security/abuse contact (CAA iodef) now points to revealdata.com, corroborating the
  acquisition. This profile was surfaced as a Techstars portfolio lead and enriched via
  the pipeline; no live API, documentation, or SDK surface was found.
